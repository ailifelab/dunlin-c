[platformio]
default_envs = esp32, esp32s3

[env]
platform = espressif32@6.10.0
framework = espidf
extra_scripts = pre:../../../scripts/pio-device-config.py
platform_packages =
    platformio/framework-espidf@3.50400.0
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_echo = no
board_build.sdkconfig_defaults = sdkconfig.defaults
build_flags = -std=gnu11

[env:esp32]
board = esp32dev
board_build.partitions = partitions-esp32.csv
extra_scripts =
    ${env.extra_scripts}
    post:../../../scripts/pio-check-device-size.py

[env:esp32s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = partitions-s3.csv
# This connected board was optically confirmed on GPIO48. Change for other boards.
build_flags = ${env.build_flags} -DDUNLIN_BOARD_LED_PIN=48
