Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "AllowMouseOpenFail" "true"
EndSection
Section "Device"
    Identifier "VirtualCard"
    Driver "dummy"
    VideoRam 16384
EndSection
Section "Monitor"
    Identifier "VirtualMonitor"
    HorizSync 28-85
    VertRefresh 48-75
    Modeline "1280x900" 93.75 1280 1352 1480 1680 900 903 909 930
EndSection
Section "Screen"
    Identifier "VirtualScreen"
    Device "VirtualCard"
    Monitor "VirtualMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x900"
    EndSubSection
EndSection
